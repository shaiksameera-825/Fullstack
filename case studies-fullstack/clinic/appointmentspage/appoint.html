    <main class="appointment-form">
        <h1>Book an Appointment</h1>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Your Name">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Your Email">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Your Phone">

            <label for="doctor">Select Doctor:</label>
            <select id="doctor">
                <option>Dr. Radha Krishna</option>
                <option>Dr. Karthik</option>
                <option>Dr. Krshnaveni</option>
                <option>Dr. Soumya</option>
            </select>
            <label for="date">Appointment Date:</label>
            <input type="date" id="date">
            <button type="button" onclick="bookAppointment()">Book Now</button>
        </form>
    </main>
    <footer>
        <p>My Clinic, Kadapa</p>
        <p>Mon–Sat: 9 AM – 6 PM</p>
        <p>Email: myclinic@gmail.com</p>
        <p>© 2026 MyClinic</p>
    </footer>
</body>
